<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>راصد</title>

  <!-- الأيقونة عند الإضافة للشاشة الرئيسية (iOS) -->
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/almaimoni1975/rased-icon/main/icon_512.png">
  <!-- أيقونة تبويب المتصفح العادية -->
  <link rel="icon" href="https://raw.githubusercontent.com/almaimoni1975/rased-icon/main/icon_512.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="راصد">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#4f6df5">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #cdeafc 0%, #dce8fb 45%, #e8dffc 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .logo {
      width: 90px;
      height: 90px;
      border-radius: 22px;
      margin-bottom: 18px;
      box-shadow: 0 8px 24px rgba(79, 109, 245, 0.35);
    }
    h1 {
      color: #1f2635;
      font-size: 22px;
      margin-bottom: 8px;
    }
    p {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .spinner {
      width: 34px;
      height: 34px;
      border: 4px solid #eef1ff;
      border-top-color: #4f6df5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a.fallback {
      margin-top: 22px;
      color: #4f6df5;
      font-weight: 700;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <img class="logo" src="https://raw.githubusercontent.com/almaimoni1975/rased-icon/main/icon_512.png" alt="راصد">
  <h1>راصد</h1>
  <p id="statusText">جارٍ التحقق...</p>
  <div class="spinner" id="spinnerEl"></div>
  <button id="openAppBtn" style="display:none;background:linear-gradient(135deg,#4f6df5,#7c5cff);color:#fff;border:none;padding:14px 28px;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(79,109,245,0.35);">🚀 فتح راصد</button>
  <a class="fallback" id="fallbackLink" href="#" style="display:none;">أو اضغط هنا</a>

  <script>
    // ضع هنا رابط تطبيق راصد الفعلي على Google Apps Script (رابط /exec الكامل)
    var RASED_APP_URL = "ضع_رابط_تطبيقك_هنا";

    document.getElementById('fallbackLink').href = RASED_APP_URL;

    // نتحقق: هل الصفحة فُتحت من الأيقونة على الشاشة الرئيسية (استخدام فعلي كتطبيق)،
    // أم فُتحت كصفحة عادية في المتصفح (مثل حالة إضافتها للشاشة الرئيسية أول مرة)؟
    var isStandalone = window.navigator.standalone === true ||
      window.matchMedia('(display-mode: standalone)').matches;

    if (isStandalone) {
      // استخدام فعلي من الأيقونة: تحويل فوري وسريع كالمعتاد
      window.top.location.href = RASED_APP_URL;
    } else {
      // تصفح عادي (على الأرجح لإضافتها للشاشة الرئيسية): لا تحويل تلقائي، امنح المستخدم وقته كاملاً
      document.getElementById('spinnerEl').style.display = 'none';
      document.getElementById('statusText').innerText = 'يمكنك الآن إضافة هذه الصفحة للشاشة الرئيسية بهدوء، أو الضغط أدناه للدخول مباشرة.';
      var btn = document.getElementById('openAppBtn');
      btn.style.display = 'inline-block';
      btn.onclick = function () { window.top.location.href = RASED_APP_URL; };
      document.getElementById('fallbackLink').style.display = 'inline-block';
    }
  </script>
</body>
</html>
